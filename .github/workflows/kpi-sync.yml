name: KPI Sync — Notion → Supabase

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync KPIs do Notion para o Supabase
        env:
          NOTION_TOKEN:         ${{ secrets.NOTION_TOKEN }}
          SUPABASE_ANON_KEY:    ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/kpi_sync.py

      - name: Ping Supabase keep-alive
        if: always()
        env:
          ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://damjldmgwksxigxtkass.supabase.co/rest/v1/companies?select=id&limit=1" \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}")
          echo "Supabase status: $STATUS"
          [ "$STATUS" = "200" ] && echo "✓ Supabase ativo" || echo "⚠ Supabase retornou $STATUS"
