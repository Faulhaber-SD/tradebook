name: Supabase Keep-Alive

on:
  schedule:
      - cron: '0 8 * * 1,4'
        workflow_dispatch:

        jobs:
          ping:
              runs-on: ubuntu-latest
                  steps:
                        - name: Ping Supabase REST API
                                run: |
                                          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
                                                      "https://damjldmgwksxigxtkass.supabase.co/rest/v1/companies?select=id&limit=1" \
                                                                  -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
                                                                              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
                                                                                        echo "Status: $STATUS"
                                                                                                  if [ "$STATUS" != "200" ]; then
                                                                                                              echo "Supabase retornou $STATUS"
                                                                                                                          exit 1
                                                                                                                                    fi
                                                                                                                                              echo "Supabase ativo"
